name: Instagram Publisher

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 4x pro Stunde prüfen (nicht zur vollen Stunde – dort verwirft GitHub oft Läufe)
  push:                      # sofort laufen, wenn der Zeitplan geändert wird
    branches: [main]
    paths:
      - "instagram/posts.yml"
      - ".github/workflows/instagram-publisher.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = Zugang testen · dry-run = nur anzeigen · publish = wirklich posten"
        type: choice
        options: [check, dry-run, publish]
        default: check

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pyyaml pillow
      - name: Posts veröffentlichen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
          WAIT_MAX_MIN: ${{ github.event_name == 'schedule' && '20' || '330' }}   # nach Änderung am Zeitplan bis zu 5,5 h auf fällige Posts warten
        run: python instagram/ig_publish.py
