- id: 2026-09-22_carbs_karussell
  type: carousel
  time: "2026-09-23 09:10"
  media: [CarbsSlide1.png, CarbsSlide2.png, CarbsSlide3.png, CarbsSlide4.png, CarbsSlide5.png, CarbsSlide6.png, CarbsSlide7.png]
  caption: |
    Carbs sind dein Trainings-Treibstoff. ⚡ Mehr Leistung, mehr Power, mehr Erfolg – wenn das Timing stimmt.

    Kohlenhydrate sind Energie – und zwar zeitsensibel: vor, während und nach der Einheit.

    🏃 Ausdauersportler wissen das längst.
    ⚽ Spielsportler profitieren oft unbemerkt: Schüsse und Konzentration bleiben in der Schlussphase besser.
    🏋️ Kraftsportler ignorieren es meist – dabei schaffen sie mit Carbs vor dem Training mehr Sätze und Wiederholungen, vor allem bei Einheiten über 45 Minuten.

    Die einfache Regel:
    👉 Protein = Menge. Rund 1,8 g pro kg Körpergewicht, verteilt auf 3–5 Mahlzeiten. Wann genau, ist zweitrangig.
    👉 Carbs = Timing. Rund um die Einheit – vorher den Tank füllen, danach wieder auffüllen.

    Wie sieht dein Pre-Workout-Essen aus? Schreib's in die Kommentare 👇

    ⚠️ Bei Diabetes oder Stoffwechselerkrankungen die Kohlenhydratzufuhr ärztlich abstimmen.

