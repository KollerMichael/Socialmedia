  caption: |
    Sauna: gut fürs Immunsystem – aber bitte nicht vor dem Training 🔥

    Regelmäßig saunieren lohnt sich: In Studien hatten Menschen, die oft in die Sauna gehen, seltener Erkältungen und Lungenentzündungen. Bei 4–7 Saunabesuchen pro Woche war das Risiko für eine Lungenentzündung rund ein Drittel niedriger. Wichtig: Das ist ein Zusammenhang, kein Beweis.

    ❌ Nicht vor Training, Spiel oder Wettkampf: Du startest aufgeheizt, verlierst Flüssigkeit über den Schweiß und dein Blutdruck sinkt. In einer Studie hielten vorgewärmte Radfahrer in der Hitze nur 28 statt 63 Minuten durch.

    ✅ So saunierst du richtig:
    🌡️ 80–100 °C (finnische Sauna) – Einsteiger auf die untere Bank
    ⏱️ 8–15 Minuten pro Gang, 2–3 Gänge
    🧊 Dazwischen abkühlen und ruhen
    📅 2–3× pro Woche ist ein guter Start
    💧 Trinken – vorher und danach

    ⚠️ Kein Alkohol. Bei Fieber oder akutem Infekt: keine Sauna. Herz- oder Blutdruckproblem? Erst ärztlich abklären. Schwindel oder Brustschmerz: sofort raus.

    Und du – gehst du in die Sauna?
    A) Ja, jede Woche
    B) Ab und zu
