  caption: |
    3 Wochen nichts. Dann 15 km am Stück. Und jetzt zwickt das Knie. 😬

    Kennst du das? Nicht die eine Wahnsinns-Einheit macht dich fitter – sondern die vielen unspektakulären Läufe dazwischen. Jeder Lauf ist ein kleiner Reiz: Herz, Muskeln und Sehnen passen sich an das an, was du regelmäßig machst. Woche für Woche.

    Der Monster-Lauf dagegen kann nach hinten losgehen: In einer Studie mit über 5.000 Läuferinnen und Läufern stieg das Verletzungsrisiko deutlich, wenn ein einzelner Lauf mehr als 10 % länger war als der längste der letzten 30 Tage.

    Meine 4 Regeln für Konstanz:
    1️⃣ Fixe Termine – 2–3 Läufe pro Woche in den Kalender
    2️⃣ Meistens locker – langsamer, als du glaubst
    3️⃣ Sanft steigern – keine Monster-Läufe
    4️⃣ Verpasst? Nicht nachholen, einfach weitermachen

    Welche Regel fällt dir am schwersten? 👇 Speichern für deinen nächsten Trainingsplan!

