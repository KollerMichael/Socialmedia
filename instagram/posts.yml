  caption: |
    „Laufen auf Asphalt ist gefährlich!“ – Mythos oder Wahrheit? 👟🛣️
    Die kurze Antwort: Nicht, wenn dein Schuh passt.

    Viele flüchten auf Wiese und Waldweg, weil Asphalt „so hart“ ist. Die Forschung sieht das entspannter: Dein Bein arbeitet wie eine Feder. Auf hartem Boden federt es automatisch weicher – schon beim ersten Schritt, ganz unbewusst.

    Weicher Boden dämpft im Labor den Stoß am Schienbein etwas. Auf echten Trails mit Erde und Schotter war aber kein Unterschied zu Asphalt messbar. Und dass weicher Boden vor Verletzungen schützt, ist nicht belegt.

    Was mehr zählt:
    ✅ Bequem: Ein Schuh, der sich beim Probelaufen gut anfühlt
    ✅ Gedämpft: Im härteren Schuh gab es in einer Studie mit 848 Hobbyläufern 52 % mehr Verletzungen (vor allem bei leichteren Läufern)
    ✅ Frisch: nicht durchgelaufen – Richtwert 500–800 km
    ✅ Sanft steigern: War ein Lauf 10–30 % länger als dein längster der letzten 30 Tage, gab es 64 % mehr Verletzungen

    Neuer Schmerz, der bleibt? Pause machen und ärztlich abklären lassen.

