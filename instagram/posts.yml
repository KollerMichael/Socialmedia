  caption: |
    Immer mehr Kilometer – und trotzdem nicht schneller? 😮‍💨

    Mehr Umfang kann dich schneller machen: Dein Herz pumpt mehr Blut pro Schlag, deine Muskeln bauen mehr „Kraftwerke“ (Mitochondrien) und feine Blutgefäße auf. Das ist deine Ausdauerbasis.

    Aber Belastung und Erholung müssen zusammenpassen. Wer 40 km pro Woche über Monate gesund und mit guter Qualität läuft, kann besser fahren als jemand, der sich auf 60 km hochschraubt – und dann ständig müde ist oder Training ausfallen lassen muss.

    Der häufigste Fehler: Die Kilometer steigen, aber Intervalle, Tempoläufe und lange Läufe bleiben genauso hart. Top-Läufer laufen den Großteil ihrer Kilometer locker. Mehr laufen heißt nicht: alles härter laufen.

    Übrigens: In einer großen dänischen Studie mit rund 5.200 Läufern stieg das Verletzungsrisiko nach einzelnen Läufen, die mehr als 10 % länger waren als der längste Lauf der letzten 30 Tage. Also: mit Plan statt blind steigern.

    Lass uns dein Training optimieren – mehr Qualität statt Quantität.
