  caption: |
    SCHON WIEDER MÜDE? Dein Körper wartet auf Licht. ☀️

    Kein Training, kein Schwitzen: ein lockerer Spaziergang oder eine ruhige Radrunde am Morgen – Tempo RPE 2 von 10, also leicht. Draußen ist es selbst an trüben Tagen viel heller als drinnen. Dieses Licht stellt deine innere Uhr – du wirst wach und abends früher müde.

    Dazu die Bewegung: Schon eine lockere Einheit hebt bei vielen die Stimmung und macht den Kopf klarer. In einer Studie senkte lockeres Training die Müdigkeit von Bewegungsmuffeln um 65 %.

    So bleibst du dran:
    1️⃣ Klein starten – 10 Minuten
    2️⃣ Wenn-dann-Plan: „Wenn ich mein Glas Wasser getrunken habe, ziehe ich die Schuhe an.“
    3️⃣ Am Abend alles zur Tür legen
    4️⃣ Gleiche Zeit, gleiche Runde
    5️⃣ Mach es schön – Lieblingsweg, Podcast
    6️⃣ Abhaken
    Und gib dir Zeit: Eine Gewohnheit braucht meist 2–5 Monate, nicht 21 Tage.

    ⏰ Stell dir jetzt den Wecker für morgen und schreib deinen Plan kurz auf: Wann, wo, wie lange.
    📌 Speichere dir dieses Posting, damit du dich morgen früh daran erinnerst – und schick es deinem Lieblings-Morgenmuffel.
