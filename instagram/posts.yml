- id: 2026-10-28_belastung-beanspruchung_karussell
  type: carousel
  time: "2026-10-28 15:00"
  media: [BelastungSlide1.png, BelastungSlide2.png, BelastungSlide3.png, BelastungSlide4.png, BelastungSlide5.png, BelastungSlide6.png, BelastungSlide7.png, BelastungSlide8.png]
  caption: |
    Schon wieder kaputt?! Dein Plan kennt dich nicht. 😤⚡

    Gleiches Tempo – und trotzdem nicht gleich hart?

    Das steckt dahinter: das Belastungs-Beanspruchungs-Konzept.

    🏋️ Belastung ist objektiv. Tempo, Dauer, Kilo, Intervalle – das, was im Plan steht. Für alle gleich.

    ❤️ Beanspruchung ist individuell. Puls, Laktat, wie anstrengend es sich anfühlt und wie lange du dich erholst. Bei jedem anders.

    Beispiel: 45 Minuten bei 6:00 min/km. Für den gut Trainierten lockere Grundlage. Für den Einsteiger fast ein Tempolauf.

    Und auch bei dir selbst schwankt es: Zu wenig Schlaf, viel Stress oder Hitze – und derselbe Lauf fühlt sich plötzlich viel härter an.

    💡 Im Profifußball messen wir deshalb beides: GPS für die Belastung, Puls und Anstrengung (0–10) für die Beanspruchung. Dein Transfer: Plane die Belastung, steuere nach der Beanspruchung. Fühlt sich locker heute hart an? Tempo raus.

    ⚠️ Brustschmerz oder Schwindel im Training? Sofort abbrechen und ärztlich abklären lassen.

    👉 Und du? Was macht dein Training härter als geplant?
    A Wenig Schlaf · B Stress · C Hitze · D Nach Krankheit
