    Schon wieder?! Perfekter Plan – und nix gemacht. 😤📋

    Fast jeder Zweite, der sich mehr Bewegung vornimmt, setzt es am Ende nicht um. Am Wissen liegt's selten – meistens am Start.

    Der Planer wartet gern auf den perfekten Moment. Der kommt oft nie. Der Macher rennt sofort los – und macht dabei schnell zu viel auf einmal. Beide haben zur Hälfte recht.

    Was wirklich hilft: ein Satz statt zehn Seiten.
    👉 „Wenn es Montag 18 Uhr ist, dann gehe ich 30 Minuten raus.“
    👉 Plan B gleich dazu: „Wenn es regnet, dann 20 Minuten Kraft daheim.“
    Solche Wenn-dann-Pläne helfen in vielen Studien, wirklich ins Tun zu kommen.

    Im Profifußball ist es genauso: Wir planen die Woche – und passen täglich an Belastung, Schlaf und Befinden an. Plan kurz. Starte klein. Passe an. Und denk dran: Etwas Bewegung ist besser als keine.

