    Aber: Langsam ist nicht gleich locker. Entscheidend ist nicht das Tempo auf der Uhr, sondern deine Intensität im Verhältnis zu deinen individuellen Schwellen. In der Leistungsdiagnostik der Sportordination bestimmen wir per Stufentest deine aerobe Schwelle – die Obergrenze deiner lockeren Läufe.

    Die wenigsten sind zu langsam – die meisten zu schnell unterwegs. Deshalb: Tempo konservativ planen. 1–2 fordernde Einheiten pro Woche reichen meist.

