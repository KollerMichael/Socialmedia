  caption: |
    KEINE ZEIT – und wieder kein Training? Das Minimum ist kleiner, als du denkst. ⏱️

    Viele denken: Unter einer Stunde Training bringt's nichts. Die Studienlage sagt etwas anderes.

    👣 Schritte: Wer statt 2.000 rund 4.000 Schritte am Tag geht, ist schon deutlich gesünder unterwegs. Bei 7.000 Schritten ist das Sterberisiko in großen Studien fast halbiert. Danach wird der Zusatznutzen kleiner.

    💪 Kraft: Ein fordernder Satz pro Übung, 6–12 Wiederholungen, 2–3 × pro Woche – das bringt schon messbar mehr Kraft. Mehr Sätze bringen mehr, aber Anfangen ist der wichtigste Schritt.

    🏃 Alltag: 3 × am Tag 1–2 Minuten flott – Stiegen statt Lift, zügig zur Bim. Bei Nicht-Sportlern ging das mit fast 40 % geringerem Sterberisiko einher.

    🔁 Stressige Phase? Um dein Niveau zu halten, reicht für einige Wochen eine Krafteinheit pro Woche mit einem Satz pro Übung – solange das Gewicht so schwer bleibt wie bisher. Zum Aufbauen brauchst du mehr.

    Fazit: Jeder Schritt zählt. Jede Wiederholung zählt. Das Minimum ist der Start – nicht das Ziel.

