- id: 2026-09-24_zone2_karussell
  type: carousel
  time: "2026-09-24 07:00"
  media: [Zone2Slide1.png, Zone2Slide2.png, Zone2Slide3.png, Zone2Slide4.png, Zone2Slide5.png, Zone2Slide6.png, Zone2Slide7.png]
  caption: |
    Langsamer trainieren – und trotzdem fitter werden? Willkommen in Zone 2.

    Im 5-Zonen-Modell ist Zone 2 dein Grundlagen-Tempo: knapp unter deiner ersten Laktatschwelle. Das Laktat liegt meist bei ca. 1–2 mmol/l. Faustregel: Du kannst dabei noch in ganzen Sätzen plaudern.

    Hier baust du deine aerobe Basis. Deine Muskeln werden besser durchblutet und nutzen Sauerstoff effizienter. Du sammelst viel Trainingszeit bei wenig Ermüdung. Ausdauer-Profis absolvieren rund 80 % ihrer Einheiten locker. Aber ehrlich: Zone 2 allein reicht nicht – die Mischung mit intensiveren Einheiten macht's.

    Und deine Gesundheit profitiert: Regelmäßige Ausdauerbewegung senkt das Risiko für Herz-Kreislauf-Erkrankungen, Typ-2-Diabetes und Bluthochdruck – und tut Stimmung und Schlaf gut. Die WHO empfiehlt 150–300 Minuten moderate Bewegung pro Woche.

    Der Haken: Faustregeln wie „Reden ist noch möglich“ oder die Standard-Zonen deiner Uhr sind nur Schätzungen – und können deutlich danebenliegen. Deine Schwelle ist individuell. In der Sportordination bestimmen wir sie mit Leistungsdiagnostik – Laktattest und/oder Spiroergometrie. Du bekommst deine persönlichen Puls- und Tempobereiche.

    Ob Gesundheit, Leistung, Lebensqualität oder einfach Freude an der Bewegung: Das ist eine Investition in dich.

    Wie steuerst du deine lockeren Einheiten – nach Gefühl, nach Uhr oder gemessen? 👇

