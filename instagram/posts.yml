  caption: |
    Laufpartner? Für einen locker – für den anderen zu schnell. 🏃‍♀️🏃

    Gleiches Tempo heißt nicht gleiche Belastung. 6:00 min/km kann für dich ein gemütlicher Lauf sein – und für deinen Partner fast am Limit.

    Und weil keiner gern bremst, rutscht das gemeinsame Tempo meist Richtung Schnellere(r). Für den anderen wird so jeder Lauf mittelhart. Echte Erholung fehlt, und harte Einheiten leiden. Über Monate kann die Schere aufgehen.

    Die Lösung: Lockere Läufe im Tempo des Langsameren. Intervalle getrennt, jeder in seinem Bereich, gemeinsam ein- und auslaufen. Und eure Bereiche messen statt schätzen.

    👉 Schick das deinem Laufpartner und plant gemeinsam, was für euch beide passt.
