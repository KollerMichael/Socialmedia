- id: 2026-09-25_rad_karussell
  type: carousel
  time: "2026-09-25 16:38"
  media: [RadSlide1.png, RadSlide2.png, RadSlide3.png, RadSlide4.png, RadSlide5.png, RadSlide6.png, RadSlide7.png]
  caption: |
    Mehr Erfolg beim Laufen! Steig auch aufs Rad! 🚴

    Beim Laufen landest du bei jedem Schritt mit etwa dem 2- bis 3-Fachen deines Körpergewichts. Am Rad fällt dieser Aufprall weg. So kannst du deinen Trainingsumfang steigern, ohne Knie, Hüfte und Sehnen zusätzlich zu belasten – und bringst Abwechslung in dein Training. In Studien verbesserte Radtraining die VO2max ähnlich wie Lauftraining.

    Achtung beim Puls: Am Rad liegt deine Herzfrequenz bei gleicher Intensität meist niedriger – oft etwa 10–15 Schläge pro Minute. Deine Lauf-Pulszonen passen also nicht 1:1 aufs Rad. Der Unterschied ist individuell verschieden. Am genauesten bestimmst du deine Rad-Zonen mit einer Leistungsdiagnostik am Ergometer (Laktat und/oder Spiroergometrie) – zum Beispiel bei uns in der Sportordination.

    Wann passt das Rad am besten? In der Grundlagenphase kannst du viel Umfang am Rad sammeln. Je näher der Wettkampf rückt, desto laufspezifischer wird dein Training. Denn: Rad ersetzt Laufen nicht ganz – für deine Laufzeit brauchst du Laufen.

