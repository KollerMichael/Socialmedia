  type: carousel
  time: "2026-10-21 14:13"
  media: [NuechternSlide1.png, NuechternSlide2.png, NuechternSlide3.png, NuechternSlide4.png, NuechternSlide5.png, NuechternSlide6.png, NuechternSlide7.png, NuechternSlide8.png]
  caption: |
    Nüchtern trainieren? Für Frauen besonders heikel. ☕❌🏃‍♀️

    Morgens raus, ohne Frühstück – „dann verbrenn ich mehr Fett“. Stimmt nur halb.

    🔥 Im Training verbrennst du nüchtern tatsächlich etwas mehr Fett – im Schnitt rund 3 Gramm pro Einheit. Über Wochen verlierst du aber nicht mehr Körperfett als mit Frühstück. Für den Fettabbau zählt deine Energiebilanz über Tage und Wochen.

    ⏱️ Dauert die Einheit länger als 60 Minuten, bist du mit Essen davor meist leistungsfähiger. Bei kürzeren Einheiten macht es kaum einen Unterschied.

    ♀️ Für Frauen besonders heikel: Das Hormonsystem reagiert empfindlich auf Energiemangel. Wer oft nüchtern trainiert und danach zu wenig isst, rutscht leichter in ein Energieloch – das kann Zyklus, Hormone und Knochen belasten. Zyklus unregelmäßig oder ausgeblieben? Ärztlich abklären lassen.

    ✅ Was trotzdem geht: locker (du kannst dabei reden), kurz (max. 60 Minuten), vorher ein großes Glas Wasser – und danach zeitnah frühstücken, mit Kohlenhydraten und Eiweiß. Intervalle, lange Einheiten und Spieltage gehören nicht auf leeren Magen. Profis tanken an harten Tagen voll.

    Mit Diabetes, in der Schwangerschaft oder bei Medikamenten: vorher ärztlich abklären.

    💬 Machst du noch Nüchterntraining? Schreib's mir in die Kommentare:
    A) Ja, regelmäßig
    B) Manchmal
