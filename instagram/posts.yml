- id: 2026-10-25_letzte-mahlzeit_karussell
  type: carousel
  time: "2026-10-25 09:45"
  media: [MahlzeitSlide1.png, MahlzeitSlide2.png, MahlzeitSlide3.png, MahlzeitSlide4.png, MahlzeitSlide5.png, MahlzeitSlide6.png, MahlzeitSlide7.png, MahlzeitSlide8.png]
  caption: |
    Bauch zwickt beim Training? Dann check dein Essens-Timing. ⏰🍝

    Beim Training holen sich deine Muskeln viel Blut – der Magen arbeitet bei harter Belastung auf Sparflamme. Wer mit vollem Bauch startet, riskiert Druck, Krämpfe oder Übelkeit. Beim Laufen öfter als am Rad, weil es den Bauch mehr durchrüttelt.

    Deine Essens-Uhr:
    🍽️ 2–4 Stunden vorher: Hauptmahlzeit – Nudeln, Reis, Erdäpfel oder Brot, etwas Eiweiß, wenig Fett
    🍌 30–60 Minuten vorher: kleiner Snack – Banane, Semmel mit Honig, Reiswaffel mit Marmelade
    💧 Unter 60 Minuten und locker? Dann ist ein Snack kein Muss.

    Lieber nach dem Training: Schnitzel und Pommes, Bohnen und Linsen, der riesige Vollkorn-Salat. Gesund – nur eben nicht direkt davor.

    Mythos: „Ein Snack kurz vorher killt die Leistung.“ Studien zeigen: Die Leistung bleibt meist gleich oder wird sogar besser. Wirst du zittrig, iss den Snack direkt vor dem Start oder beim Aufwärmen.

    Länger als 60 Minuten? Dann bringen Kohlenhydrate vorher meist mehr Leistung. Und harte Intervalle laufen vor allem mit Kohlenhydraten – also nicht leer losstarten.

    So machen's die Profis im Fußball: letzte große Mahlzeit 3–4 Stunden vor Anpfiff, am Spieltag nichts Neues ausprobieren. Und: Der Bauch ist trainierbar. Teste im Training, was du verträgst.

    👇 Und du? Wie lange vor dem Training isst du?
    A unter 30 Minuten · B 30–60 Minuten · C 1–2 Stunden · D mehr als 2 Stunden
