  caption: |
    Dein Körper will Abwechslung. 🏊‍♂️🚴‍♂️🏃‍♂️

    Swim, Bike, Run – das Triathlon-Prinzip ist mehr als ein Wettkampf. Alle drei trainieren dein Herz-Kreislauf-System. Aber jede Sportart belastet deinen Körper anders.

    💧 Schwimmen: Ganzkörper, gelenkschonend
    🚴 Rad: starke Beine, viel Ausdauer, wenig Stoß
    🏃 Laufen: wichtige Stoßreize für Knochen und Sehnen
    🏋️ Kraft: 2 × pro Woche für Muskeln und Knochen

    Eine große Studie mit über 111.000 Erwachsenen (über 30 Jahre begleitet) zeigt: Wer die meisten verschiedenen Sportarten machte, hatte ein um 19 % geringeres Sterberisiko – auch bei gleicher Bewegungsmenge. Eine Beobachtungsstudie, also kein Beweis. Aber ein starkes Argument für den Mix. 📊

    Und Abwechslung macht Spaß: Wer variiert, bleibt eher dran.

    ⚠️ Kein Freifahrtschein: Auch Triathleten verletzen sich – meist beim Laufen. Umfang langsam steigern, den Großteil wirklich locker trainieren, Ruhetage einplanen. Im Freiwasser nie allein schwimmen. Neu im Ausdauersport oder Vorerkrankungen? Vorher ärztlich checken lassen.

