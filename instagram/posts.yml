  caption: |
    DEINE UHR LÜGT? Du bist am Limit – und sie sagt „locker“. ⌚

    Das kann passieren. Deshalb: Diese 5 Dinge muss deine Sportuhr können.

    Rund 48 Millionen Smartwatches und Fitnessbänder wurden weltweit allein von April bis Juni 2026 ausgeliefert (IDC). Die Auswahl ist riesig, für dein Training zählen aber nur wenige Funktionen:

    ✅ GPS für Tempo und Strecke
    ✅ Brustgurt koppelbar (Bluetooth oder ANT+)
    ✅ eigene Pulszonen eintragen
    ✅ Intervalle programmieren
    ✅ mind. 10 h GPS-Akku + Datenexport (Strava & Co.)

    Warum der Brustgurt? Die Uhr misst den Puls mit Licht durch die Haut. Bei Einheiten mit wenig Dynamik, etwa beim Walken oder lockeren Radfahren, klappt das gut. Beim Laufen und bei Intervallen sind die Werte oft fehlerhaft. Der Brustgurt misst elektrisch, direkt am Herzen, und ist in Studien deutlich genauer.

    Meine 3 Tipps für Hobbysportler (unbezahlte Empfehlung, keine Kooperation · UVP, Stand Oktober 2026):
    1️⃣ Garmin Forerunner 170 (299 €): Allrounder mit Trainingsbereitschaft, HRV-Status und Barometer
    2️⃣ Coros Pace 4 (269 €): Dual-Band-GPS und 31 h GPS-Akku
    3️⃣ Wahoo-Setup: Apple Watch Series 12 (449 €) mit der neuen Wahoo-App + Wahoo TRACKR Brustgurt (89,99 €). Wahoo baut keine eigene Uhr mehr, setzt aber seit September 2026 auf die Apple Watch. Der TRACKR funktioniert auch mit Garmin und Coros.

    Und ganz wichtig: VO2max und Pulszonen aus der Uhr sind Schätzungen. Im Schnitt passen sie gut, bei dir persönlich können sie deutlich daneben liegen. Auch die Formel „220 minus Alter“ trifft deinen Maximalpuls oft nicht. Deine echten Zonen bekommst du aus einer Leistungsdiagnostik.

    Welche Uhr trägst du? Schreib's in die Kommentare 👇 und speicher dir den Post für den nächsten Uhr-Kauf.

