  caption: |
    Dieser Fehler ruiniert deine Intervalle – und er passiert oft schon am Tag davor.

    Sonntag Long Run. Montag Krafttraining mit Beinen. Dienstag „lockere“ 10 km, die doch etwas zu schnell waren. Mittwoch Intervalle – und die Pace will einfach nicht kommen.

    Vielleicht fehlt dir nicht die Fitness, sondern Erholung. Hartes Beintraining kann bis zu 48 Stunden nachwirken. Wer müde startet, verliert oft genau das, was er trainieren will: Tempo, Technik und die Qualität jeder Wiederholung.

    Du musst nicht für jeden Lauf frisch sein – aber frisch genug für die wichtigen. Mach den Tag vor deiner Schlüsseleinheit wirklich leicht. Ein Ruhetag ist kein verlorener Trainingstag.

    Und wenn du dann frisch bist: Gewinn nicht das erste Intervall. Starte kontrolliert und halte die Qualität bis zur letzten Wiederholung.

    Was machst du am Tag vor deinen Intervallen? 👇
    🛋️ A – Ruhetag
    🏃 B – Easy Run
    🏋️ C – Krafttraining
    🔥 D – Ganz normal weiter

