  caption: |
    3 Zeichen, dass du zu hart trainierst 👇

    Müde Beine nach einer harten Einheit? Normal – das gehört zum Training dazu. Genauer hinschauen solltest du, wenn sich Warnzeichen über mehrere Tage häufen und die Erholung ausbleibt:

    ① Deine Leistung sinkt – wiederholt, nicht nur an einem schlechten Tag.
    ② Du bist ständig müde – trotz Schlaf nicht erholt, die Lust aufs Training sinkt.
    ③ Locker fühlt sich nicht mehr locker an – dein gewohntes Tempo wird plötzlich zur Arbeit.

    Der typische Fehler: Leistung schlechter → noch härter trainieren. So kann sich die Müdigkeit immer weiter aufstauen. Manchmal ist die beste Einheit: keine.

    Wichtig: Nach 1–2 Wochen mit viel Erholung immer noch nicht besser – oder Fieber, Brustschmerz, Herzstolpern? Dann nicht durchtrainieren, sondern ärztlich abklären lassen. Hinter anhaltender Müdigkeit kann auch ein Infekt, Eisenmangel oder zu wenig Energie aus dem Essen stecken.

    Fortschritt entsteht durch Belastung + Erholung.

    Wie gut bist du darin, einen Ruhetag zu machen, wenn dein Körper ihn braucht? 👇
    A) Kein Problem 😎
    B) Fällt mir schwer 😅
