  caption: |
    SIEHT NOCH GUT AUS? INNEN IST ER LÄNGST TOT. 👟 Die Dämpfung lässt nach, lange bevor du es siehst: In einer Laborstudie war der Druck an der Ferse nach 500 km doppelt so hoch – sichtbare Schäden zeigten sich erst ab rund 750 km.

    Und noch etwas: Dein Laufschuh braucht einen Partner.

    In einer Studie mit 264 Hobbyläufern hatten jene, die abwechselnd mehrere Paare liefen, ein um 39 % geringeres Verletzungsrisiko. Ein Beweis ist das nicht – aber ein starkes Signal. Die Vermutung der Forscher: Jeder Schuh belastet Sehnen, Muskeln und Gelenke etwas anders.

    Wichtig: Es geht nicht um die „Erholung“ des Schaums. Pausen retten die Dämpfung kaum. Der Wechsel hilft DIR.

    Wie lange hält ein Laufschuh? Als Richtwert 500–800 km – je nach Modell, Körpergewicht und Untergrund. Carbon-Wettkampfschuhe verlieren ihren Vorteil teils schon nach rund 450 km.

    Ist dein Schuh durch? Check diese 5 Zeichen:
    1️⃣ Außensohle glatt, der Schaum schaut durch
    2️⃣ Tiefe Falten oder Risse in der Zwischensohle
    3️⃣ Der Schuh steht schief auf dem Tisch
    4️⃣ Fersenkappe weich, Futter durchgescheuert
    5️⃣ Neues Ziehen nach gewohnten Läufen – dann Schuh checken

    Beschwerden, die nicht weggehen? Ärztlich abklären lassen.

    👉 Und du: Wie viele Laufschuhe hast du? 1, 2–3 oder schon eine ganze Sammlung? Schreib's in die Kommentare!
