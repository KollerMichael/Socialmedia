  caption: |
    Musik an – und plötzlich läuft's? 🎧

    Das ist messbar: Eine große Meta-Analyse mit 139 Studien zeigt, Musik beim Sport hebt die Stimmung, lässt die Anstrengung etwas leichter wirken und bringt ein kleines, aber messbares Leistungsplus. Spannend: Dein Puls ändert sich dabei kaum.

    Warum? Musik lenkt dich von Müdigkeitssignalen ab, weckt Emotionen – und der Beat gibt deiner Bewegung den Rhythmus vor. Wer Schritt oder Tritt an den Takt anpasst, bewegt sich oft sogar ökonomischer.

    So nutzt du's:
    ▶️ Lockere Einheiten: ruhigere Songs (ca. 115–125 BPM)
    ▶️ Fordernde Abschnitte: schnellere Songs (ca. 125–140 BPM)
    ▶️ Deinen Lieblingssong hebst du dir für den härtesten Teil auf
    ▶️ Draußen: so leise, dass du den Verkehr hörst

    Gut zu wissen: Ganz am Limit dämpft Musik das Anstrengungsgefühl kaum – aber das Training macht trotzdem mehr Spaß.

