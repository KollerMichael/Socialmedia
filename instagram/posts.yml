  caption: |
    SITZEN SCHWÄCHT DEIN GEHIRN. 🧠
    Zumindest, wenn du stundenlang ohne Pause sitzt.

    Nach 4 Stunden Sitzen am Stück sinkt die Durchblutung deines Gehirns messbar. Schon 2 Minuten lockeres Gehen alle 30 Minuten verhindern das.

    Und es wird noch besser: Im Gehen hatten Testpersonen der Stanford University im Schnitt 60 % mehr kreative Ideen als im Sitzen – am Laufband drinnen genauso wie draußen.

    Mein Tipp als Athletiktrainer: Ideen sammelst du im Gehen. Knifflige Aufgaben mit nur einer richtigen Lösung erledigst du direkt danach – dann ist dein Kopf wach.

