- id: 2026-10-18_periodisierung_karussell
  type: carousel
  time: "2026-10-18 08:00"
  media: [PeriodisierungSlide1.png, PeriodisierungSlide2.png, PeriodisierungSlide3.png, PeriodisierungSlide4.png, PeriodisierungSlide5.png, PeriodisierungSlide6.png, PeriodisierungSlide7.png, PeriodisierungSlide8.png]
  caption: |
    Stillstand? Rennen um Rennen – aber nicht schneller. 😤

    Viele Hobbysportler hangeln sich von Wettkampf zu Wettkampf. Jede Woche ein bisschen härter, locker wird es selten – und echte Pausen fehlen. Das Ergebnis kennst du vielleicht: Die Leistung stagniert.

    Profis planen in Phasen (Periodisierung):
    1️⃣ Grundlage – die längste Phase: viel locker, dazu Technik & Kraft
    2️⃣ Aufbau – mehr Tempo, immer wettkampfnäher
    3️⃣ Wettkampf – Tapering: ca. 2 Wochen vorher Umfang um 40–60 % senken, Tempo halten
    4️⃣ Übergang – 2–4 Wochen locker & abwechslungsreich erholen

    Dazu kommen die Zyklen: dein Jahr (Makro), Blöcke von 3–6 Wochen (Meso) und deine Trainingswoche (Mikro) – oft mit einer leichteren Woche alle 3–4 Wochen.

    Warum die Grundlage so wichtig ist: Herz, Muskeln und Stoffwechsel passen sich an – Sehnen brauchen dafür länger als deine Kondition. Ausdauer-Profis trainieren rund 80 % locker. Locker heißt aber wirklich locker – deine Bereiche bestimmst du am genauesten per Leistungsdiagnostik.

    Egal welche Jahreszeit: Plane rückwärts von deinem Saisonziel – erst die Basis, dann das Tempo. 🏗️

    👇 In welcher Trainingsphase bist DU gerade? A Grundlage · B Aufbau · C Wettkampf · D Übergang – schreib's in die Kommentare und speichere dir den Post für deine Saisonplanung.

