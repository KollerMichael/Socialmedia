- id: 2026-10-30_haltung2_karussell
  type: carousel
  time: "2026-10-30 15:11"
  media: [HaltungSlide1.png, HaltungSlide2.png, HaltungSlide3.png, HaltungSlide4.png, HaltungSlide5.png, HaltungSlide6.png, HaltungSlide7.png]
  caption: |
    Ständig verspannt?! Dein Schreibtisch gewinnt. Noch. 😤💻

    Laptop, Handy, Lenkrad, Sofa: Die Arme sind vorne, die Hüfte ist gebeugt. Stundenlang. Muskeln passen sich an das an, was du täglich tust – in beide Richtungen.

    🔸 Brustmuskel: meist in kurzer Position, neigt zur Verkürzung und kann die Schultern nach vorne ziehen
    🔸 Schulterblatt-Fixatoren: im Alltag kaum gefordert, werden abgeschwächt
    🔸 Hüftbeuger: im Sitzen stundenlang gebeugt, selten voll gestreckt
    🔸 Gesäßmuskel: beim Sitzen kaum aktiv, verliert ohne Training Kraft

    Warum das zählt? Haltung ist kein Schönheitsideal. Aufrecht hast du mehr Bewegungsfreiheit in der Schulter – wichtig für deine Technik. Starke Hüftstrecker bringen Antrieb in den Sprint. Krafttraining senkt das Risiko für Sportverletzungen deutlich. Und ein starker Körper macht den Alltag leichter: Stiegen, Tragen, Aufstehen.

    Die gute Nachricht: Es gibt keine perfekte Haltung. Gut ist, wenn du sie jederzeit wechseln kannst. Dafür brauchst du Kraft in voller Bewegung:
    ✅ Rudern – Schulterblätter aktiv zusammenziehen
    ✅ Tiefe Liegestütze – Brust kommt unter Last in die Dehnung
    ✅ Ausfallschritt mit Becken nach vorn – Hüftbeuger wird gestreckt
    ✅ Hüftbrücke – oben das Gesäß fest anspannen
    2× pro Woche, sauber und kontrolliert. Krafttraining über die volle Bewegung macht dich stark – und ähnlich beweglich wie Dehnen.

    ⚠️ Schmerzen, Taubheit oder Kribbeln? Ärztlich abklären lassen.

