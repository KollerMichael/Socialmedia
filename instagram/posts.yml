  caption: |
    VERKÜHLT – TRAINING JA ODER NEIN?

    Fieber ist eine Red Flag. Ab ca. 38 °C, bei Gliederschmerzen, Schüttelfrost oder Herzrasen in Ruhe heißt es: Pause. Ein Infekt kann auch das Herz mitbetreffen (Herzmuskelentzündung) – selten, aber gefährlich. Fiebersenker ändern daran nichts.

    Nur Schnupfen oder leichtes Halskratzen, kein Fieber, und du fühlst dich fit? Dann ist lockere Bewegung oft möglich: 15–30 Minuten konservativ locker mit RPE 2 von 10 (leicht). Keine Intervalle, kein Tempo. Wird es schlechter, hörst du sofort auf.

    Wettkampf, Match, Intervalle oder Leistungstest? Nein. Dort kannst du die Belastung nicht steuern.

    Mein Tipp aus dem Profifußball: Das Comeback konservativ planen. Erst beschwerdefrei, dann kurz und locker starten, 24 Stunden beobachten, langsam steigern. Brustschmerz, Herzstolpern, Atemnot oder Schwindel beim Training? Sofort stoppen und ärztlich abklären lassen.

    Warst du beim Training oder Wettkampf schon mal angeschlagen? Schreib's in die Kommentare – und speichere dir den Post für die Erkältungszeit.

