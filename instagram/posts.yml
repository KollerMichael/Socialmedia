  type: carousel
  time: "2026-10-25 14:00"
  media: [CarbonSlide1.png, CarbonSlide2.png, CarbonSlide3.png, CarbonSlide4.png, CarbonSlide5.png, CarbonSlide6.png, CarbonSlide7.png, CarbonSlide8.png]
  caption: |
    Carbonschuhe: Profi-Turbo – auch für dich? 👟⚡

    Superschuhe sieht man heute überall: beim Marathon genauso wie beim Sonntagslauf im Prater. Aber was bringen sie wirklich?

    🔬 Was drinsteckt: ein sehr leichter, stark federnder Schaum, eine Carbonplatte und eine gebogene Sohle. Der Effekt kommt aus dem Zusammenspiel. In einem Test wurde die Platte sogar zerschnitten – der Spareffekt blieb.

    🏃 Profis & schnelle Läufer: Im Labor sparten gut trainierte Läufer bei 14–18 km/h rund 4 % Energie. Eine Meta-Analyse aus 14 Studien zeigt im Schnitt knapp 3 % weniger Energiebedarf. Im Wettkampf zählt jede Sekunde – hier ist der Schuh ein echter Vorteil.

    🙋 Hobbyläufer: Bei 5:00–6:00 min/km war der Vorteil in einer Studie nur noch rund 1 %, bei 6:00 min/km nicht sicher messbar. Nicht jeder profitiert gleich. Der Schuh macht dich schneller – fitter macht dich nur dein Training.

    ⚠️ Langsam umsteigen: In einer Fallserie hatten 5 Läufer und Triathleten nach dem Umstieg eine Stressfraktur im Fuß. Ein Beweis ist das nicht – aber ein Grund, den Schuh schrittweise einzuführen. Schmerzen im Fuß? Ärztlich abklären lassen.

    ✅ Mein Tipp: Carbonschuh für Rennen und ausgewählte schnelle Einheiten, lockere Läufe im normalen Trainingsschuh. Und: bequem muss er sein.

