  media: [RPuls_01.png, RPuls_02.png, RPuls_03.png, RPuls_04.png, RPuls_05.png, RPuls_06.png, RPuls_07.png]
  caption: |
    Dein Puls kann lügen. 🫀 Ruhepuls 48 – und trotzdem nicht fit? Das geht.

    Ein niedriger Ruhepuls ist ein gutes Zeichen: Ein trainiertes Herz pumpt mehr Blut pro Schlag und muss seltener schlagen. Große Studien zeigen: Pro 10 Schläge mehr in Ruhe steigt das Sterberisiko um rund 9 %.

    Aber: Der Ruhepuls ist nur der Leerlauf. Gene, Schlaf, Stress und Medikamente verändern ihn. Wie fit du bist, zeigt sich unter Belastung – also daran, wie weit dein Herz hochfahren kann. Das ist die Herzfrequenzreserve: Maximalpuls minus Ruhepuls.

    Betablocker senken den Ruhepuls – aber auch den Maximalpuls. Die Reserve schrumpft, die maximale Leistung sinkt. Wichtig: Betablocker sind oft medizinisch notwendig. Nie selbst absetzen, Training mit deiner Ärztin/deinem Arzt abstimmen.

    Die gute Nachricht: Dein Motor ist trainierbar. Schon eine Fitness-Stufe mehr – etwa 1 km/h schneller laufen können – geht mit rund 13 % geringerem Sterberisiko einher. Jeder km/h zählt.

    Tiefer Puls und dazu Schwindel, Leistungsknick oder Ohnmacht? Ärztlich abklären lassen.

    Wie fit bist du wirklich? Messen statt raten: Eine Leistungsdiagnostik mit Spiroergometrie zeigt dir VO2max, Maximalpuls, Herzfrequenzreserve und deine Trainingszonen.

    👉 Speichern & schreib in die Kommentare: Wie hoch ist dein Ruhepuls?

