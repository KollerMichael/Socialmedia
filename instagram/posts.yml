  caption: |
    Wettkampf als Training? Dein Körper zahlt die Rechnung. ⚡

    Trainierst du FÜR den Wettkampf – oder IM Wettkampf? Ich seh's ständig: Jedes Wochenende ein Rennen, weil man ja „dabei besser wird“. Meistens wird man dabei vor allem eines: müde.

    Ein Wettkampf ist Vollgas. Danach braucht dein Körper Erholung – nach einem Marathon sind Muskelwerte oft erst nach 4 bis 8 Tagen wieder normal. In dieser Zeit baust du keine Form auf.

    Meine Faustregel aus der Praxis: Pro Wettkampfkilometer ½ Tag Regeneration. Nach einem 10er also rund 5 Tage, nach einem Marathon rund 3 Wochen – locker bewegen ja, harte Einheiten und neue Rennen nein.

    Form entsteht im Training: Ausdauer-Profis trainieren rund 80 % locker und nur rund 20 % intensiv. Vor dem Hauptrennen fahren sie den Umfang runter und halten die Intensität. Bei über 158.000 Hobby-Marathonläufer:innen waren die mit strengem 3-Wochen-Taper im Mittel rund 5½ Minuten schneller als jene, die kaum reduziert haben.

    Mein Tipp aus dem Profisport: Training ist Training. Wettkampf ist Wettkampf. Plane wenige Hauptrennen – und geh frisch an den Start.

    👇 Wo und wann ist dein nächster Wettkampf? Schreib's in die Kommentare!

    Ab 35 oder mit Risikofaktoren: Vor einer intensiven Wettkampfsaison ärztlich checken lassen.

