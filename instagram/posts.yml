  caption: |
    Hart trainiert – und dann den ganzen Tag sitzen? 🪫

    Dein Training dauert eine Stunde. Was machst du mit den restlichen 15 wachen Stunden?

    Training ist wichtig – keine Frage. Aber der Alltag ist ein Hebel, den viele unterschätzen. In einer großen Studie ging über 8 Jahre ein Plus von rund 4.300 Schritten pro Tag mit gleich viel mehr Ausdauer-Fitness einher wie 17 Minuten zügiges Training täglich.

    Das heißt: Stiege statt Lift, eine Station früher aussteigen, alle 30 Minuten kurz aufstehen, mit dem Rad zur Arbeit. Kleine Dinge – aber jeden Tag.

    Im Profifußball schauen wir nicht nur auf die Trainingseinheit, sondern auf die ganze Belastung über den Tag. Das kannst du auch. Wisch dich durch die 5 Hebel und such dir einen aus, mit dem du morgen startest.

    👉 Welcher Hebel ist dein Einstieg? Schreib die Nummer in die Kommentare – und speicher dir den Post für später.

